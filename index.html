<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>♡</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    body {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* Full-screen video background */
    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
    }

    /* Full-screen transparent light artwork */
    .light-image {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      z-index: 1;
    }

    /* Invisible clickable area over the light */
    .light-click {
      position: fixed;
      left: 36%;
      top: 50%;
      width: clamp(56px, 6vw, 150px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      cursor: pointer;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }

    /* Tablets and smaller screens */
    @media (max-width: 899px) {
      .light-click {
        width: clamp(48px, 9vw, 100px);
      }
    }

    /* Mobile screens */
    @media (max-width: 599px) {
      .light-click {
        width: clamp(44px, 12vw, 76px);
      }
    }

    /* Large desktops */
    @media (min-width: 1440px) {
      .light-click {
        width: clamp(100px, 5.5vw, 150px);
      }
    }

    /* Extra-large monitors */
    @media (min-width: 1920px) {
      .light-click {
        width: 150px;
      }
    }
  </style>
</head>

<body>

  <video autoplay muted loop playsinline>
    <source src="lv_0_20261010210354.mp4" type="video/mp4">
  </video>

  <!-- Looping background audio -->
  <audio id="background-audio" loop preload="auto">
    <source src="page1audio.mp3" type="audio/mpeg">
  </audio>

  <img
    class="light-image"
    src="Untitled28_20261010213949.png"
    alt="Glowing light"
  >

  <a
    href="page2.html"
    class="light-click"
    aria-label="Enter"
  ></a>

  <script>
    const audio = document.getElementById("background-audio");
    const enterLink = document.querySelector(".light-click");

    // Try to play audio; browsers may require a user interaction.
    function startAudio() {
      audio.play().catch(() => {
        // Audio can start after the visitor interacts with the page.
      });
    }

    // Attempt autoplay when the page loads.
    startAudio();

    // Start audio after the first interaction if autoplay was blocked.
    document.addEventListener("pointerdown", startAudio, { once: true });
    document.addEventListener("keydown", startAudio, { once: true });
  </script>

</body>
</html>
