
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♡</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: black;
      width: 100%;
      height: 100%;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .light {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  cursor: pointer;
}

    .light img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: fill;
    }

    @keyframes floatGlow {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
      }

      50% {
        transform: translate(-50%, -50%) scale(1.08);
      }
    }
    
.light-click {
  position: fixed;
  left: 30%;
  top: 50%;
  width: 12%;
  aspect-ratio: 1;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  z-index: 2;
  cursor: pointer;
}
    
  </style>
</head>

<body>

  <video autoplay muted loop playsinline>
    <source src="lv_0_20261010210354.mp4" type="video/mp4">
  </video>

  <a href="page2.html" class="light">
    <img src="Untitled28_20261010213949.png" alt="Glowing light">
  </a>

</body>
</html>
