
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♡</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: black;
      width: 100%;
      height: 100%;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .light {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 150px;
      transform: translate(-50%, -50%);
      z-index: 1;
      cursor: pointer;
      animation: floatGlow 2s ease-in-out infinite;
    }

    .light img {
      display: block;
      width: 100%;
      height: auto;
    }

    @keyframes floatGlow {
      0%, 100% {
        transform: translate(-50%, -50%) scale(1);
      }

      50% {
        transform: translate(-50%, -50%) scale(1.08);
      }
    }
  </style>
</head>

<body>

  <video autoplay muted loop playsinline>
    <source src="lv_0_20261010210354.mp4" type="video/mp4">
  </video>

  <a href="page2.html" class="light">
    <img src="Home_20261010_211441_0000.png" alt="Glowing light">
  </a>

</body>
</html>
